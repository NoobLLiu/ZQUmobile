name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 构建 APK
    # 与 ZQUHelper 保持一致：windows-latest 的 Android SDK 镜像已预装 CMake，
    # AGP 构建 :jni 模块时可直接找到，无需联网下载（ubuntu runner 会缺 CMake 而失败）。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      # Pub 缓存默认在 C:，工程 checkout 在 D:，
      # Kotlin 增量编译跨盘根算相对路径会崩（different roots），
      # 把缓存挪到与工程同一盘符。
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 双保险：关掉 Kotlin 增量编译，避免跨盘根缓存问题
      - name: Disable Kotlin incremental compilation
        run: Add-Content -Path android/gradle.properties -Value "`nkotlin.incremental=false"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      # 产物就是单个 apk，不套压缩包
      - name: Rename APK
        shell: pwsh
        run: Move-Item "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/掌上砚园.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 掌上砚园
          path: app/build/app/outputs/flutter-apk/掌上砚园.apk
          if-no-files-found: error
          retention-days: 90

      # 打 tag 时同时挂到 Release，可直接下载安装
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/掌上砚园.apk
