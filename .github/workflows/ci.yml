name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 APK
    # 与 ZQUHelper 保持一致：windows-latest 的 Android SDK 镜像已预装 CMake，
    # AGP 构建 :jni 模块时可直接找到，无需联网下载（ubuntu runner 会缺 CMake 而失败）。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      # Pub 缓存默认在 C:，工程 checkout 在 D:，
      # Kotlin 增量编译跨盘根算相对路径会崩（different roots），
      # 把缓存挪到与工程同一盘符。
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 双保险：关掉 Kotlin 增量编译，避免跨盘根缓存问题
      - name: Disable Kotlin incremental compilation
        run: Add-Content -Path android/gradle.properties -Value "`nkotlin.incremental=false"

      # 版本号从 pubspec.yaml 读，避免 CI 与工程里写两份
      - name: Read version
        id: ver
        shell: bash
        run: |
          LINE=$(grep '^version:' pubspec.yaml)
          VERSION=$(echo "$LINE" | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD=$(echo "$LINE" | sed 's/.*+//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION ($BUILD)"

      - name: Pub get
        run: flutter pub get

      # 固定 release 签名：以前 release 走 debug 签名，而 windows runner 每次都是全新环境、
      # debug.keystore 现生成，于是每个版本签名都不同 → 手机上覆盖安装必报「签名不一致」。
      # 这里从 Secrets 还原固定的密钥库，保证所有版本用同一把密钥签名。
      - name: Setup release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.ANDROID_KEYSTORE_BASE64，无法使用固定签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -keystore android/app/release.jks -storepass "$STORE_PASSWORD" | tail -3
          echo "密钥库就绪：$(ls -l android/app/release.jks)"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # 版本/提交号注入到 App 内，界面上可直接看到「这是哪一版」。
      # --split-per-abi：按指令集拆成 3 个 APK，每个只含一种 ABI 的 native 库，
      # 体积约为 universal 整包的 1/3（实测整包 52MB → 单 ABI 15–19MB）。
      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }} \
            --dart-define=APP_BUILD_NUMBER=${{ steps.ver.outputs.build }} \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_TIME=$(date -u +%Y-%m-%dT%H:%MZ)

      # 不套压缩包，直接上传 3 个 APK；文件名带版本号 + ABI，避免与旧包混淆。
      # 用 ASCII 文件名：中文名在 windows runner 上经 gh CLI 上传会被吞掉（实测变成 -1.0.2.apk）。
      - name: Rename APKs
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" \
               "zhangshangyanyuan-${{ steps.ver.outputs.version }}-$abi.apk"
          done
          ls -lh

      # 自检：确认产物确实是用固定 release 密钥签的（指纹写死在这里，
      # 换成别的密钥或退回 debug 签名都会在这里直接失败，不会把坏包发出去）。
      - name: Verify APK signing certificate
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}-arm64-v8a.apk"
          EXPECTED="b99c6a83926b37950f58bfe2e42e8e94dd32e561e11115c554d18db9011ce4cc"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${SDK//\\//}"
          SIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name 'apksigner.bat' 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then
            echo "使用 apksigner: $SIGNER"
            OUT=$("$SIGNER" verify --print-certs "$APK")
            echo "$OUT"
            ACTUAL=$(echo "$OUT" | grep -m1 -oE 'SHA-256 digest: [0-9a-fA-F]+' | sed 's/.*: //' | tr 'A-F' 'a-f')
          else
            echo "未找到 apksigner，退回 keytool"
            OUT=$(keytool -printcert -jarfile "$APK")
            echo "$OUT"
            ACTUAL=$(echo "$OUT" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "实际证书指纹: $ACTUAL"
          echo "预期证书指纹: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名与固定密钥不符，覆盖安装仍会失败"
            exit 1
          fi
          echo "✅ 签名指纹一致，可覆盖安装"

      # 每个 APK 单独上传且不打包（archive: false），Actions 页面直接显示 3 个
      # 可单独点击下载的 .apk，而不是一个 zip。
      # 注意：archive 参数从 upload-artifact v5 起才有，v4 不支持。
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 90

      # 每次 main 构建都更新「latest」Release：
      # 上传 3 个 ABI 的 .apk 直链（不是 zip），文件名带版本号，不会被旧包顶掉。
      # 上传后清掉 latest 里旧的整包 / 旧版本 APK，避免页面堆过期文件。
      - name: Publish to Release (latest)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BUILD="${{ steps.ver.outputs.build }}"
          DIR="build/app/outputs/flutter-apk"
          META="$DIR/version.json"
          APKS=("$DIR/zhangshangyanyuan-$VERSION-arm64-v8a.apk" \
                "$DIR/zhangshangyanyuan-$VERSION-armeabi-v7a.apk" \
                "$DIR/zhangshangyanyuan-$VERSION-x86_64.apk")

          # 机器可读的版本清单：以后 App 内检测更新只需 GET 这一个文件。
          # 版本号 / build 号 / 提交号 / 构建时间只有 CI 拿得全，必须在这里生成；
          # Gitee 同步脚本只负责把里面的下载直链改写成 Gitee 地址。
          ZSY_VERSION="$VERSION" ZSY_BUILD="$BUILD" \
          ZSY_REPO="${{ github.repository }}" ZSY_SHA="${{ github.sha }}" \
          ZSY_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ)" \
          python - "$META" "${APKS[@]}" <<'PY'
          import hashlib, json, os, sys

          meta, files = sys.argv[1], sys.argv[2:]
          abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
          repo = os.environ["ZSY_REPO"]
          assets = []
          for path in files:
              name = os.path.basename(path)
              abi = next((a for a in abis if name.endswith("-%s.apk" % a)), "unknown")
              h, size = hashlib.sha256(), 0
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
                      size += len(chunk)
              assets.append({
                  "abi": abi,
                  "name": name,
                  "size": size,
                  "sha256": h.hexdigest(),
                  "url": "https://github.com/%s/releases/download/latest/%s" % (repo, name),
              })
          data = {
              "schemaVersion": 1,
              "package": "com.nooblliu.zhangshang_yanyuan",
              "version": os.environ["ZSY_VERSION"],
              "versionCode": int(os.environ["ZSY_BUILD"]),
              "buildNumber": int(os.environ["ZSY_BUILD"]),
              "fullVersion": os.environ["ZSY_VERSION"] + "+" + os.environ["ZSY_BUILD"],
              "tag": "latest",
              "gitSha": os.environ["ZSY_SHA"],
              "buildTime": os.environ["ZSY_BUILD_TIME"],
              "releaseNotes": "由 CI 自动构建，每次提交更新。",
              "assets": assets,
          }
          with open(meta, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("version.json: %s (%s)" % (data["fullVersion"], data["buildTime"]))
          PY

          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest \
              --title "掌上砚园 $VERSION ($BUILD)" \
              --notes "由 CI 自动构建，每次提交更新。版本清单见 version.json。" \
              --prerelease
          fi
          gh release edit latest \
            --title "掌上砚园 $VERSION ($BUILD)" \
            --notes "由 CI 自动构建，每次提交更新。版本清单见 version.json。"
          gh release upload latest "${APKS[@]}" "$META" --clobber

          KEEP="zhangshangyanyuan-$VERSION-arm64-v8a.apk zhangshangyanyuan-$VERSION-armeabi-v7a.apk zhangshangyanyuan-$VERSION-x86_64.apk version.json"
          for name in $(gh release view latest --json assets --jq '.assets[].name'); do
            case " $KEEP " in *" $name "*) continue ;; esac
            if [[ "$name" == zhangshangyanyuan-*.apk ]]; then
              gh release delete-asset latest "$name" --yes || true
            fi
          done

          gh release view latest --json assets --jq '.assets[] | "\(.name)  \(.size)"'
