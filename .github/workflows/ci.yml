name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 APK
    # 与 ZQUHelper 保持一致：windows-latest 的 Android SDK 镜像已预装 CMake，
    # AGP 构建 :jni 模块时可直接找到，无需联网下载（ubuntu runner 会缺 CMake 而失败）。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      # Pub 缓存默认在 C:，工程 checkout 在 D:，
      # Kotlin 增量编译跨盘根算相对路径会崩（different roots），
      # 把缓存挪到与工程同一盘符。
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 双保险：关掉 Kotlin 增量编译，避免跨盘根缓存问题
      - name: Disable Kotlin incremental compilation
        run: Add-Content -Path android/gradle.properties -Value "`nkotlin.incremental=false"

      # 版本号从 pubspec.yaml 读，避免 CI 与工程里写两份
      - name: Read version
        id: ver
        shell: bash
        run: |
          LINE=$(grep '^version:' pubspec.yaml)
          VERSION=$(echo "$LINE" | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD=$(echo "$LINE" | sed 's/.*+//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION ($BUILD)"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # 版本/提交号注入到 App 内，界面上可直接看到「这是哪一版」
      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }} \
            --dart-define=APP_BUILD_NUMBER=${{ steps.ver.outputs.build }} \
            --dart-define=GIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_TIME=$(date -u +%Y-%m-%dT%H:%MZ)

      # 产物就是单个 apk，不套压缩包；文件名带版本号，避免与旧包混淆。
      # 用 ASCII 文件名：中文名在 windows runner 上经 gh CLI 上传会被吞掉（实测变成 -1.0.2.apk）。
      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}.apk"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhangshangyanyuan-${{ steps.ver.outputs.version }}
          path: app/build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      # 每次 main 构建都更新「latest」Release：
      # 给出可直接下载的 .apk 直链（不是 zip），且文件名带版本号，不会被旧包顶掉。
      - name: Publish to Release (latest)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="build/app/outputs/flutter-apk/zhangshangyanyuan-${{ steps.ver.outputs.version }}.apk"
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest \
              --title "最新构建" \
              --notes "由 CI 自动构建，每次提交更新。" \
              --prerelease
          fi
          gh release upload latest "$APK" --clobber
          echo "下载直链：$(gh release view latest --json assets --jq '.assets[].url' | head -1)"
